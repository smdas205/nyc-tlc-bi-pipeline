# ─────────────────────────────────────────────
#  NYC TLC Data Engineering Stack
#  Services: PostgreSQL · Redis · Spark (official ASF)
#            Airflow (CeleryExecutor) · Superset
# ─────────────────────────────────────────────

x-airflow-common: &airflow-common
  build:
    context: ./airflow_files
    dockerfile: Dockerfile
  # image: apache/airflow:3.2.1-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://tlc-redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: "lSBmBB16HWWElGNJtZkDvTkm1bGxJnSktpnkfWxhyEA="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SCHEDULER__STANDALONE_DAG_PROCESSOR: "true"
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    # PySpark + project dependencies installed at container startup
  volumes:
    - ./airflow_files/dags:/opt/airflow/dags
    - ./airflow_files/logs:/opt/airflow/logs
    - ./airflow_files/plugins:/opt/airflow/plugins
    - ./data:/opt/spark/data
    - ./data:/opt/airflow/data
    - ./data/raw:/opt/airflow/data/raw
    - ./spark/jobs:/opt/airflow/spark/jobs
  depends_on: &airflow-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  networks:
    - tlc-net

# ─────────────────────────────────────────────
#  Named Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  spark_logs:

# ─────────────────────────────────────────────
#  Network
# ─────────────────────────────────────────────
networks:
  tlc-net:
    driver: bridge

# ─────────────────────────────────────────────
#  Services
# ─────────────────────────────────────────────
services:
  # ── PostgreSQL ──────────────────────────────
  # Dual-purpose: Airflow metadata + OLAP warehouse
  # Schemas: airflow, warehouse, superset
  postgres:
    image: postgres:15-alpine
    container_name: tlc-postgres
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d # init SQL: create warehouse DBs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - tlc-net

  # ── Redis ────────────────────────────────────
  # DB 0 → Airflow Celery broker
  # DB 1 → Application - Level Aggregate Cache
  redis:
    image: redis:7.2-alpine
    container_name: tlc-redis
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - tlc-net

  # ── Spark Master ─────────────────────────────
  # Official ASF image — no Bitnami dependency
  spark-master:
    image: apache/spark:3.5.1
    container_name: tlc-spark-master
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    user: root
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8090
      SPARK_NO_DAEMONIZE: "true"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master"]
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - spark_logs:/opt/spark/logs
    ports:
      - "7077:7077" # Master RPC (used by Airflow SparkSubmitOperator)
      - "8090:8090" # Master Web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090 || exit 1"]
      interval: 30s
      retries: 3
      start_period: 20s
    networks:
      - tlc-net

  # ── Spark Worker 1 ────────────────────────────
  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: tlc-spark-worker-1
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    user: root
    environment:
      SPARK_WORKER_WEBUI_PORT: 8091
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_NO_DAEMONIZE: "true"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - spark_logs:/opt/spark/logs
    ports:
      - "8091:8091"
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - tlc-net

  # ── Spark Worker 2 ────────────────────────────
  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: tlc-spark-worker-2
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    user: root
    environment:
      SPARK_WORKER_WEBUI_PORT: 8092
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_NO_DAEMONIZE: "true"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - spark_logs:/opt/spark/logs
    ports:
      - "8092:8092"
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - tlc-net

  # ── Airflow DB Init ───────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: tlc-airflow-init
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin"
      _AIRFLOW_WWW_USER_FIRSTNAME: "Admin"
      _AIRFLOW_WWW_USER_LASTNAME: "TLC"
      _AIRFLOW_WWW_USER_ROLE: "Admin"
      _AIRFLOW_WWW_USER_EMAIL: "admin@tlc.local"
    volumes:
      - ./airflow_files:/sources
    networks:
      - tlc-net

  # ── Airflow API Server (Web UI) ─────────────────────────
  airflow-api-server:
    <<: *airflow-common
    container_name: tlc-airflow-api-server
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:8080/public/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler ─────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: tlc-airflow-scheduler
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Celery Worker ─────────────────────
  airflow-worker:
    <<: *airflow-common
    container_name: tlc-airflow-worker
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Triggerer ─────────────────────────
  airflow-triggerer:
    <<: *airflow-common
    container_name: tlc-airflow-triggerer
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    command: triggerer
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Flower (Celery Monitor) ───────────────────
  flower:
    <<: *airflow-common
    container_name: tlc-flower
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    command: celery flower
    ports:
      - "5555:5555"
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow DAG Processor
  airflow-dag-processor:
    <<: *airflow-common
    container_name: tlc-airflow-dag-processor
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: dag-processor
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
